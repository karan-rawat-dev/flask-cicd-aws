version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Running basic syntax checks..."
      - python -m compileall app.py
  build:
    commands:
      - echo "Build phase complete."
artifacts:
  files:
    - '**/*'